[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m3-education-memory"
version = "0.1.0"
description = "Single-learner handwritten math memory prototype inspired by M3-Agent"
requires-python = ">=3.10"
dependencies = [
  "pyarrow>=15",
  "Pillow>=10",
  "sympy>=1.13",
]

[project.scripts]
m3-edu-memory = "m3_edu_memory.cli:main"
m3-edu-memory-api = "m3_edu_memory.server:main"

[tool.setuptools.packages.find]
where = ["src"]
